{% extends 'events/base.html' %}
{% block content %}
<div class="card">
  <h1>{{ event.title }}</h1>
  <p>{{ event.date }} • {{ event.location }}</p>
  <p>{{ event.description }}</p>
</div>
<div class="card">
  <h2>Register</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Submit Registration</button>
  </form>
</div>
{% endblock %}
